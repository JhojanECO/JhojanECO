name: Profile stats

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 01:00 Lima
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/stats_card.py, tools/dragon_contrib.py, .github/workflows/profile-stats.yml]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stats card and dragon calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/stats_card.py
          python tools/dragon_contrib.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/dragon-contrib.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile stats"
          git push
