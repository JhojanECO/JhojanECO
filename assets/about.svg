  <title id="t">About Jhojan, written as a C++ struct: Mechatronics Engineering student at UNI who writes embedded firmware for competition robots (line follower, mini-sumo, soccer) on ATmega328P, ESP32 and STM32. Now: bare-metal timers and PD control on a line follower. Learning: control theory beyond PID. Open to embedded, robotics and control projects.</title>
