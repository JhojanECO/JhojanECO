<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-labelledby="t">
  <title id="t">End of track: the line-follower robot reaches the finish line.</title>
  <defs>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="chk" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#E6EDF3"/><rect width="6" height="6" fill="#0D1117"/><rect x="6" y="6" width="6" height="6" fill="#0D1117"/>
    </pattern>
  </defs>
  <path d="M 0 70 L 1000 70" stroke="#DC143C" stroke-width="7" stroke-linecap="round"/>
  <rect x="860" y="46" width="24" height="48" fill="url(#chk)"/>
  <text x="872" y="32" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="14" fill="#00F0FF">&gt; end of track</text>
  <g>
    <rect x="-9" y="-16" width="18" height="6" rx="2" fill="#30363D"/>
    <rect x="-9" y="10" width="18" height="6" rx="2" fill="#30363D"/>
    <rect x="-15" y="-11" width="30" height="22" rx="6" fill="#161B22" stroke="#DC143C" stroke-width="2.5"/>
    <circle cx="-4" cy="0" r="3" fill="#DC143C"/>
    <line x1="18" y1="-10" x2="18" y2="10" stroke="#30363D" stroke-width="5" stroke-linecap="round"/>
    <g fill="#00F0FF" filter="url(#g)"><circle cx="18" cy="-8" r="1.7"/><circle cx="18" cy="-4" r="1.7"/><circle cx="18" cy="0" r="1.9"/><circle cx="18" cy="4" r="1.7"/><circle cx="18" cy="8" r="1.7"/></g>
    <animateTransform attributeName="transform" type="translate" values="-40 70;830 70;830 70" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.4 1;0 0 1 1"/>
  </g>
</svg>
